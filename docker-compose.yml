services:
  # ── Redis (Celery broker) ───────────────────────────────────────────────────
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379:6379"
    restart: always

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - SQLITE_DB_PATH=/data/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_started
    restart: always

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      - SQLITE_DB_PATH=/data/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_started
    restart: always

  # ── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - SQLITE_DB_PATH=/data/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_started
    restart: always

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8001
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
